credentials:
  system:
    domainCredentials:
      - credentials:
          - aws:
              accessKey: "${AWS_CREDENTIALS_S3_ARTIFACTS_KEY}"
              id: "s3_artifacts_credentials"
              scope: GLOBAL
              secretKey: "${AWS_CREDENTIALS_S3_ARTIFACTS_SECRET}"
          - string:
              id: "harborn_pypi_secret"
              scope: GLOBAL
              secret: "${PRIVATE_PYPI_SECRET}"
          - usernamePassword:
              id: "harborn_pypi_username_password"
              scope: GLOBAL
              password: "${PRIVATE_PYPI_SECRET}"
              username: "${PRIVATE_PYPI_USER}"
          - string:
              id: "harborn_kubernetes"
              scope: GLOBAL
              secret: "${KUBERNETES_SA_TOKEN}"
