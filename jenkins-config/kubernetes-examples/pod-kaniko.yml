apiVersion: v1
kind: Pod
metadata:
  name: kaniko
spec:
  containers:
    - name: kaniko
      image: gcr.io/kaniko-project/executor:debug
      args: [
          "--dockerfile=Dockerfile",
          "--context=git://https://github.com/<project-name>",
          "--destination=dockerhub/<repo>", # replace with the dockerhub account
          "--cleanup",
        ]
      volumeMounts:
        - name: kaniko-secret
          mountPath: /kaniko/.docker
  restartPolicy: Never
  volumes:
    - name: kaniko-secret
      secret:
        secretName: docker-credentials # Name of the docker credentials
        items:
          - key: .dockerconfigjson
            path: config.json
