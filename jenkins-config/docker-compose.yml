services:
  jenkins:
    container_name: jenkins
    build:
      context: .
      dockerfile: docker-resources/Dockerfile
    privileged: true
    user: root
    ports:
      - 8080:8080
      - 50000:50000
    env_file:
      - .env
    environment:
      - JAVA_OPTS=-Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true
